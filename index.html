<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Arbitrary Waveform Editor</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  html, body {
    margin: 0;
    font-family: sans-serif;
    display: flex;
    flex-flow: column;
    height: 100%;
  }

  /* Header section with title and GitHub banner */
  #header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 20px;
    background-color: #f8f9fa;
    border-bottom: 1px solid #dee2e6;
  }

  h2 {
    margin: 0;
    font-size: 18px;
    color: #393633;
  }

  /* GitHub Banner */
  #githubBanner {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    background-color: #0d6efd;
    border-radius: 4px;
    box-shadow: 0 2px 8px rgba(13, 110, 253, 0.3);
    font-size: 14px;
    color: white;
    text-decoration: none;
    font-weight: 500;
  }

  #githubBanner:hover {
    background-color: #0b5ed7;
    box-shadow: 0 4px 16px rgba(13, 110, 253, 0.4);
    transform: translateY(-1px);
  }

  .github-icon {
    width: 16px;
    height: 16px;
  }

  input {
     width: 300px;
  }

  input[type="file"]::file:mr4 {
    margin-right: 8px;
  }

 
  /* Hide the default file input */
  #fileInput {
    display: none;
  }

  /* File button and Save CSV button styled to match GitHub banner */
  .file-upload, button {
    border-radius: 4px;
    font-size: 14px;
    background-color: #0d6efd;
    color: white;
    border: 0;
    padding: 6px 12px;
    font-weight: 500;
    margin-left: 8px;
    cursor: pointer;
  }

  .file-upload:hover, button:hover {
    background-color: #0b5ed7;
    box-shadow: 0 4px 16px rgba(13, 110, 253, 0.4);
    transform: translateY(-1px);
  }

  #controls {
    flex: 0 1 auto;
    padding: 15px 20px;
    background: #f0f0f0;
    border-bottom: 1px solid #dee2e6;
  }

  #chartContainer {
    flex: 1 1 auto;
    position: relative;
    overflow: hidden;
  }

  #chart {
    touch-action: none;
  }
</style>
</head>

<body>

<!-- Header section with title and GitHub banner -->
<header id="header">
  <h2>Arbitrary Waveform Editor</h2>
  <a href="https://github.com/markerrj/arbitrary_waveform_editor" id="githubBanner" target="_blank" rel="noopener noreferrer">

    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#fff" class="bi bi-github" viewBox="0 0 16 16">
       <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/>
    </svg>
    <span>Fork Me on Github</span>
  </a>
</header>

<div id="controls">
  <input type="file" id="fileInput" onclick="this.value=null" accept=".csv" style="display: none;" />
  <label id="fileBtn" class="file-upload">Choose File</label>
  <button id="saveBtn">Save CSV</button>
</div>

<div id="chartContainer">
  <canvas id="chart"></canvas>
</div>

<script>
let chart;
let dataValues = new Array(2048).fill(0);
let isDragging = false;
let isDrawing = false;

const canvas = document.getElementById('chart');

function updateCanvasSize() {
   canvas.width = canvas.parentElement.clientWidth;
   canvas.height = canvas.parentElement.clientHeight;
}

updateCanvasSize();
drawChart();

window.addEventListener('resize', () => {
  updateCanvasSize();
});

document.getElementById('fileInput').addEventListener('change', function(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {
        const text = e.target.result;

        const lines = text.split('\n');
        const filteredLines = lines.filter(line => {
            const trimmed = line.trim();
            return trimmed !== '' && !trimmed.startsWith('#');
        });

        dataValues = filteredLines
            .join(' ')
            .split(/[\s,]+/)
            .map(Number)
            .filter(v => !isNaN(v));

        if (dataValues.length !== 2048) {
            alert("Expected 2048 values, got " + dataValues.length);
            return;
        }

        drawChart();
    };

    reader.readAsText(file);
});

function drawChart() {
    const ctx = canvas.getContext('2d');
    const labels = dataValues.map((_, i) => i);

    if (chart) chart.destroy();

    chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                data: dataValues,
                borderColor: 'blue',
                borderWidth: 1,
                pointRadius: 0,
                tension: 0
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
	    plugins: {
              legend: {
                display: false
              }
            },
            scales: {
                x: {
                    title: {
                        display: false,
                        text: 'Index (0 - 2047)'
                    }
                },
                y: {
                    min: -1,
                    max: 1,
                    title: {
                        display: false,
                        text: 'Value (-1 to 1)'
                    }
                }
            }
        }
    });
}

let lastIndex = null;
let lastValue = null;

// --- Interaction (Mouse and Touch) ---

document.getElementById('fileBtn').addEventListener('click', function() {
  document.getElementById('fileInput').click();
});

function getCoordinates(event) {
    if (event.touches && event.touches.length > 0) {
        return { clientX: event.touches[0].clientX, clientY: event.touches[0].clientY };
    }
    return { clientX: event.clientX, clientY: event.clientY };
}

canvas.addEventListener('mousedown', (event) => {
    isDragging = true;
    if (!isDrawing) {
       requestAnimationFrame(handleDraw(event)); // draw on click
       isDrawing = true;
    }
});

canvas.addEventListener('mouseup', (event) => {
    isDragging = false;
    lastIndex = null;
    lastValue = null;
});

canvas.addEventListener('mouseleave', (event) => {
    isDragging = false;
    lastIndex = null;
    lastValue = null;
});

canvas.addEventListener('mousemove', function(event) {
    if (!isDragging || !chart) return;
    if (!isDrawing) {
       requestAnimationFrame(handleDraw(event)); // draw on click
       isDrawing = true;
    }
});

canvas.addEventListener('touchstart', (event) => {
    event.preventDefault(); // prevent scrolling/zooming
    isDragging = true;
    if (!isDrawing) {
       requestAnimationFrame(handleDraw(event)); // draw on touch
       isDrawing = true;
    }
});

canvas.addEventListener('touchend', (event) => {
    event.preventDefault();
    isDragging = false;
    lastIndex = null;
    lastValue = null;
});

canvas.addEventListener('touchcancel', (event) => {
    event.preventDefault();
    isDragging = false;
    lastIndex = null;
    lastValue = null;
});

canvas.addEventListener('touchmove', function(event) {
    event.preventDefault(); // prevent scrolling/zooming
    if (!isDragging || !chart) return;
    if (!isDrawing) {
       requestAnimationFrame(handleDraw(event)); // draw on touch
       isDrawing = true;
    }
});

function handleDraw(event) {
    const rect = canvas.getBoundingClientRect();

    // Support both mouse and touch events
    const coords = getCoordinates(event);
    const clientX = coords.clientX;
    const clientY = coords.clientY;

    const x = clientX - rect.left;
    const y = clientY - rect.top;

    const xScale = chart.scales.x;
    const yScale = chart.scales.y;

    let index = Math.round(xScale.getValueForPixel(x));
    if (index < 0 || index >= dataValues.length) return;

    let value = yScale.getValueForPixel(y);
    value = Math.max(-1, Math.min(1, value));

    // --- Interpolation logic ---
    if (lastIndex !== null && Math.abs(index - lastIndex) > 1) {
        const start = lastIndex;
        const end = index;

        const step = end > start ? 1 : -1;
        const distance = Math.abs(end - start);

        for (let i = 1; i < distance; i++) {
            const t = i / distance; // interpolation factor 0→1
            const interpIndex = start + i * step;

            const interpValue =
                lastValue + t * (value - lastValue);

            dataValues[interpIndex] = interpValue;
        }
    }

    // Set current point
    dataValues[index] = value;

    // Save last position
    lastIndex = index;
    lastValue = value;

    chart.update('none');

    isDrawing = false;
}

// --- Save CSV ---

document.getElementById('saveBtn').addEventListener('click', function() {
    if (dataValues.length !== 2048) {
        alert("No valid data to save.");
        return;
    }

    const csvContent = dataValues.map(v => v.toString()).join('\n');

    const blob = new Blob([csvContent], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = 'arbitrary_waveform.csv';
    a.click();

    URL.revokeObjectURL(url);
});
</script>

</body>
</html>
